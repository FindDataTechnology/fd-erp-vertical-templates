name: gates

# 这个仓的四道门（绑定 provider 存在性、角色词表 ×3、面级对位 ×2、appliance 副本、清单形状）
# 此前只在有人本地跑 pytest 时生效——等于约定不是门。2026-11-08 抓到"meituan 写进外卖结算"
# "shopify 写进订单收款"两处已上架的错，都是这些门该拦而没跑的情形。
#
# 面级对位门在 CI 里**不会跳过**：它优先读 open-connector-mt checkout，没有就读入库快照
# tests/fixtures/connector-binding-actions.json。目录侧若有变化，本地跑
# scripts/refresh_connector_catalog_ids.py 刷新快照并随包一起提交。

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Gates
        run: python -m pytest -q

      - name: 快照新鲜度（有目录 checkout 时才可能跑，缺失则跳过）
        run: python scripts/refresh_connector_catalog_ids.py --check || echo "无 open-connector-mt checkout：跳过目录新鲜度比对"
